version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  # Major upgrades wait for the TypeScript rewrite, which replaces most of
  # these dependencies anyway.
  ignore:
  - dependency-name: "*"
    update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
