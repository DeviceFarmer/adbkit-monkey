name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No lockfile is committed, so npm ci is not an option.
      - name: Install
        run: npm install

      # The tests load the package through main, which is the compiled lib/.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
